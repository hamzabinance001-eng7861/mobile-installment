name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the build attach the signed APK to the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's ubuntu runners ship the Android SDK; accept licenses so Gradle can fetch platform 35 if missing.
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # The project has no Gradle wrapper jar; AGP 8.7 needs Gradle 8.9+.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Release keystore decoded."
          else
            echo "::warning::No RELEASE_KEYSTORE_B64 secret: the APK will be signed with the DEBUG key (testing only)."
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show signing-certificate checksum for QR provisioning
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          # APKs for minSdk 26+ use v2/v3 signatures, which keytool cannot read; apksigner can.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          HEX=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | sed 's/.*: *//' | tr -d ' :')
          if [ -z "$HEX" ]; then echo "::error::Could not read the signing certificate from $APK"; exit 1; fi
          B64=$(echo "$HEX" | xxd -r -p | base64 -w0 | tr '+/' '-_' | tr -d '=')
          echo "APK: $APK"
          echo "PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM: $B64"
          {
            echo "### Provisioning checksum"
            echo "Put this in the admin panel setting \`Provisioning:ApkSignatureChecksum\`:"
            echo
            echo "\`$B64\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Keeps the QR-provisioning download link (…/releases/download/1.0.0/app-release.apk) pointing at the latest build.
      # Only a build signed with the permanent release key is published, never a debug-signed one.
      - name: Publish signed APK to release 1.0.0
        if: github.ref == 'refs/heads/main' && env.RELEASE_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view 1.0.0 >/dev/null 2>&1 || gh release create 1.0.0 --title "Installment app 1.0.0" --notes "Signed APK used for device provisioning."
          gh release upload 1.0.0 app/build/outputs/apk/release/app-release.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: installment-customer-app-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
